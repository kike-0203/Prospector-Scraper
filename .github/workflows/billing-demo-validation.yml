name: Validate Prospector billing demo

on:
  pull_request:
    paths:
      - 'web/**'
      - 'billing-demo/**'
      - '.github/workflows/billing-demo-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-save --package-lock=false
      - name: Build frontend production bundle
        working-directory: web
        run: npm run build
      - name: Test demo billing API and frontend route
        run: node --test billing-demo/*.test.mjs
      - name: Download isolated PocketBase v0.38.0 for integration test
        run: |
          curl -fLSs --retry 3 -o /tmp/pocketbase.zip https://github.com/pocketbase/pocketbase/releases/download/v0.38.0/pocketbase_0.38.0_linux_amd64.zip
          mkdir -p /tmp/pocketbase-lab
          unzip -q /tmp/pocketbase.zip pocketbase -d /tmp/pocketbase-lab
          chmod +x /tmp/pocketbase-lab/pocketbase
      - name: Run real PocketBase persistence and restart integration test
        env:
          PB_BINARY: /tmp/pocketbase-lab/pocketbase
        run: node --test billing-demo/pocketbase.integration.test.mjs
